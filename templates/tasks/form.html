{% extends "base.html" %}
{% load bootstrap4 %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="form-page mx-auto"><a href="{% url 'tasks:list' %}" class="back-link">← К списку задач</a><div class="form-card mt-3"><h1 class="h3 mb-1">{{ page_title }}</h1><p class="text-muted mb-4">Заполните информацию о задаче</p><form method="post" novalidate>{% csrf_token %}{% bootstrap_form form %}<div class="form-actions mt-4"><button class="btn btn-primary btn-lg" type="submit">{{ button_text }}</button><a class="btn btn-light btn-lg ml-2" href="{% url 'tasks:list' %}">Отмена</a></div></form></div></div>
{% endblock %}
