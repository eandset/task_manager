{% extends "base.html" %}
{% load bootstrap4 %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-card mx-auto"><div class="auth-mark">↗</div><h1 class="h3 text-center">С возвращением!</h1><p class="text-muted text-center mb-4">Войдите, чтобы продолжить работу</p><form method="post">{% csrf_token %}{% bootstrap_form form %}<button type="submit" class="btn btn-primary btn-block btn-lg mt-3">Войти</button></form><p class="text-center mt-4 mb-0">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p></div>
{% endblock %}
